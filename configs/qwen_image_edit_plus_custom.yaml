trainer: QwenImageEditPlus

model:
  # Using full precision FP16 model (recommended with A100 80GB)
  # Provides best quality, ~28GB VRAM usage per GPU
  pretrained_model_name_or_path: "Qwen/Qwen-Image-Edit-2509"
  quantize: false  # No runtime quantization needed with 80GB VRAM
  lora:
    r: 64                     # higher rank to leverage larger dataset; adjust if VRAM becomes a constraint
    lora_alpha: 64
    init_lora_weights: gaussian
    target_modules: ["to_k", "to_q", "to_v", "to_out.0"]
    pretrained_weight: null
    adapter_name: lora_edit

data:
  class_path: src.data.dataset.ImageDataset
  init_args:
    dataset_path:
      - workspace/metadata-v12-recaptioned-long/train_filtered_2k_regenerated.csv
    caption_dropout_rate: 0.0
    prompt_image_dropout_rate: 0.0
    use_edit_mask: false  # No masks in dataset
    selected_control_indexes: null  # Set to null since CSV only has one control image (path_control)
    # Image filtering thresholds (updated for 2k resized dataset)
    # All images pre-processed to max 2000px dimension
    max_image_dimension: 2500  # Skip images wider or taller than this (buffer above 2000px)
    max_file_size_mb: 15       # Skip image files larger than this MB (resized images are smaller)
    skip_on_error: true         # Skip problematic images instead of crashing
    processor:
      class_path: src.data.preprocess.ImageProcessor
      init_args:
        process_type: center_crop
        resize_mode: bilinear
        target_size: [832, 576]
        controls_size: [[832, 576]]  # Main control image uses same size as target
  batch_size: 4               # Per GPU batch size (4 × 8 GPUs = 32 samples per step)
  num_workers: 8              # Data loading workers per GPU
  shuffle: true

logging:
  output_dir: /skynas/01/hardik/qwen-lora/qwen-edit-plus-custom
  report_to: wandb
  tracker_project_name: qwen_edit_plus_custom
  wandb_entity: null  # Optional: your wandb username or team name
  wandb_tags: ["qwen-edit-plus", "image-editing", "lora"]  # Tags for organizing runs
  wandb_notes: "Qwen Image Edit Plus training with LoRA on custom dataset"  # Optional run description
  log_gradients: true  # Enable gradient norm logging
  log_parameters: true  # Enable parameter statistics logging
  log_memory: true  # Enable memory usage tracking
  enhanced_metrics_interval: 10  # Log enhanced metrics every N steps
  sampling:
    enable: true
    validation_steps: 100
    num_samples: 8
    seed: 42
    validation_data: workspace/metadata-v12-recaptioned-long/val_filtered_2k_regenerated.csv
    # Image quality metrics (LPIPS, MSE, PSNR) - computed when target images are available
    compute_metrics: true  # Enable perceptual and pixel-based metrics
    lpips_net: vgg  # LPIPS network: 'alex' (fast), 'vgg' (accurate), 'squeeze' (fastest)

optimizer:
  class_path: bitsandbytes.optim.Adam8bit
  init_args:
    lr: 1.0e-4
    betas: [0.9, 0.999]

lr_scheduler:
  scheduler_type: cosine
  warmup_steps: 200
  num_cycles: 0.5
  power: 1.0

loss:
  mask_loss: false  # No masks in dataset - using standard uniform loss
  # Min-SNR loss weighting (recommended for better convergence)
  use_min_snr: true               # Enable min-SNR weighting
  min_snr_gamma: 5.0              # Gamma parameter (typical: 5.0, paper recommendation)
  min_snr_normalize_weights: true # Normalize weights to mean ≈ 1 (prevents loss collapse)
  prediction_type: null           # Auto-detect from scheduler (v_prediction for flow matching)

train:
  gradient_accumulation_steps: 2    # Effective batch size = 4 × 2 × 8 GPUs = 64
  max_train_steps: 6000            # Adjust based on dataset size and convergence
  checkpointing_steps: 500
  checkpoints_total_limit: 10
  max_grad_norm: 1.0
  mixed_precision: bf16
  gradient_checkpointing: true
  low_memory: true
  fit_device:
    vae: cuda:0
    text_encoder: cuda:1

cache:
  devices:
    vae: cuda:2
    text_encoder: cuda:3
  cache_dir: ${logging.output_dir}/cache
  use_cache: true
  prompt_empty_drop_keys:
    - prompt_embeds
    - pooled_prompt_embeds

predict:
  devices:
    vae: cuda:0
    text_encoder: cuda:0
    dit: cuda:0

resume: null
