trainer: QwenImageEditPlus

model:
  # TODO: replace with the actual checkpoint you plan to fine-tune (e.g. Qwen/Qwen-Image-Edit-Plus)
  pretrained_model_name_or_path: "ovedrive/qwen-image-edit-4bit"
  quantize: false
  lora:
    r: 32                     # higher rank to leverage larger dataset; adjust if VRAM becomes a constraint
    lora_alpha: 32
    init_lora_weights: gaussian
    target_modules: ["to_k", "to_q", "to_v", "to_out.0"]
    pretrained_weight: null
    adapter_name: lora_edit

data:
  class_path: src.data.dataset.ImageDataset
  init_args:
    dataset_path:
      - workspace/metadata-v12-recaptioned-long/train_filtered_2k.csv
    caption_dropout_rate: 0.0
    prompt_image_dropout_rate: 0.0
    use_edit_mask: true
    selected_control_indexes: null  # Set to null since CSV only has one control image (path_control)
    # Image filtering thresholds (updated for 2k resized dataset)
    # All images pre-processed to max 2000px dimension
    max_image_dimension: 2500  # Skip images wider or taller than this (buffer above 2000px)
    max_file_size_mb: 15       # Skip image files larger than this MB (resized images are smaller)
    skip_on_error: true         # Skip problematic images instead of crashing
    processor:
      class_path: src.data.preprocess.ImageProcessor
      init_args:
        process_type: center_crop
        resize_mode: bilinear
        target_size: [832, 576]
        controls_size: [[832, 576]]  # Main control image uses same size as target
  batch_size: 2               # start conservative; scale up after confirming memory headroom
  num_workers: 4              # reduced from 8 to handle large images (8256px) more safely
  shuffle: true

logging:
  output_dir: /skynas/01/hardik/qwen-lora/qwen-edit-plus-custom
  report_to: wandb
  tracker_project_name: qwen_edit_plus_custom
  wandb_entity: null  # Optional: your wandb username or team name
  wandb_tags: ["qwen-edit-plus", "image-editing", "lora"]  # Tags for organizing runs
  wandb_notes: "Qwen Image Edit Plus training with LoRA on custom dataset"  # Optional run description
  log_gradients: true  # Enable gradient norm logging
  log_parameters: true  # Enable parameter statistics logging
  log_memory: true  # Enable memory usage tracking
  enhanced_metrics_interval: 10  # Log enhanced metrics every N steps
  sampling:
    enable: true
    validation_steps: 100
    num_samples: 4
    seed: 42
    validation_data: workspace/metadata-v12-recaptioned-long/val_filtered_2k.csv

optimizer:
  class_path: bitsandbytes.optim.Adam8bit
  init_args:
    lr: 5.0e-5
    betas: [0.9, 0.999]

lr_scheduler:
  scheduler_type: cosine
  warmup_steps: 500
  num_cycles: 0.5
  power: 1.0

loss:
  mask_loss: true
  forground_weight: 2.0
  background_weight: 1.0

train:
  gradient_accumulation_steps: 4    # effective batch size 8 when combined with batch_size 2 across 8 GPUs
  max_train_steps: 20000            # revisit after confirming dataset size and epochs
  checkpointing_steps: 500
  checkpoints_total_limit: 10
  max_grad_norm: 1.0
  mixed_precision: bf16
  gradient_checkpointing: true
  low_memory: true
  fit_device:
    vae: cuda:0
    text_encoder: cuda:1

cache:
  devices:
    vae: cuda:2
    text_encoder: cuda:3
  cache_dir: ${logging.output_dir}/cache
  use_cache: true
  prompt_empty_drop_keys:
    - prompt_embeds
    - pooled_prompt_embeds

predict:
  devices:
    vae: cuda:0
    text_encoder: cuda:0
    dit: cuda:0

resume: null
